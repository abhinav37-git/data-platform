name: ci

on:
  push:
  pull_request:

jobs:
  sql-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: python -m pip install -r requirements.txt
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load the source table
        run: PGPASSWORD=analytics psql -h localhost -U analytics -d analytics -v ON_ERROR_STOP=1 -f sql/init.sql
      - name: Lint SQL
        run: sqlfluff lint dbt/models --config .sqlfluff
      - name: Build and test dbt models
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Run pytest
        run: pytest
